name: Android CI

# What this does for the app:
#   - Debug build check  -> proves the app compiles (all flavors of breakage
#     from Kotlin, Compose, Hilt, Room show up here).
#   - Unit tests         -> runs :app:testDebugUnitTest (web-search pipeline,
#     parsers, DTOs, benchmark math). Results uploaded as artifacts.
#   - Android Lint       -> catches performance, correctness and security
#     issues in Android code + Compose. Report uploaded as artifact.
# Runs on every push to main/worker and every PR targeting main.

on:
  push:
    branches: [main, worker]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: r26c
          emulator: false
          platform: 34

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
