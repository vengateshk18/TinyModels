name: Release AAB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release AAB
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Run unit tests (release gate)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Attach AAB to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/*.aab
          generate_release_notes: true